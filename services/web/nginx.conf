# nginx de W-N06: cara pública de la web. L'aplicació Flask (gunicorn) escolta a 127.0.0.1:5000.

# No mostrar la versió d'nginx (a tots els servidors)
server_tokens off;

# HTTP: tot es redirigeix a HTTPS
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS amb certificat autosignat (el genera init.sh)
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/w-n06.crt;
    ssl_certificate_key /etc/ssl/private/w-n06.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
