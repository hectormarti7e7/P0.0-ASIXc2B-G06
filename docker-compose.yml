# P0.0 - Desplegament d'infraestructura amb Docker
# Cada servei és un contenidor. Els clients (Linux i Windows) no hi són: són màquines
# virtuals a Isard que arriben a la intranet per la xarxa itb 6, a través d'aquest equip
# (scripts/xarxa-clients.sh).
# Variables a .env (copia .env.example). NCC = identificador de l'equip (N06).
name: p00-${NCC:-N06}

x-base: &base
  restart: unless-stopped
  cap_add: [NET_ADMIN]

# Xarxes de la pràctica (adreçament fix)
networks:
  dmz:                              # serveis exposats a Internet
    ipam:
      config: [{ subnet: 10.213.1.0/24, gateway: 10.213.1.1 }]
  intranet:                         # serveis interns; els clients (VM d'Isard) hi arriben per itb 6
    driver_opts:
      com.docker.network.bridge.name: br-intranet   # nom fix, l'usa scripts/xarxa-clients.sh
      # Els clients d'Isard arriben als contenidors per enrutament directe: des de Docker 28
      # això està bloquejat per defecte (regles raw PREROUTING). Només afecta a la intranet.
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config: [{ subnet: 10.213.2.0/24, gateway: 10.213.2.1 }]
  nat:                              # sortida a Internet
    ipam:
      config: [{ subnet: 10.213.3.0/24, gateway: 10.213.3.1 }]

volumes:
  db-data:                          # dades de MySQL (persistents)

services:
  # Router: únic contenidor connectat a les tres xarxes. Fa el reenviament,
  # el NAT cap a Internet i el firewall (services/router/init.sh).
  router:
    <<: *base
    build: { context: ./images/base }
    image: p00-base
    container_name: R-${NCC:-N06}
    hostname: R-${NCC:-N06}
    command: ["sleep", "infinity"]
    sysctls: { net.ipv4.ip_forward: "1" }
    environment:
      GATEWAY: 10.213.3.1            # sortida a Internet (xarxa NAT)
    volumes:
      - ./services/router/init.sh:/opt/init.sh:ro
    networks:
      nat:      { ipv4_address: 10.213.3.2 }
      dmz:      { ipv4_address: 10.213.1.254 }
      intranet: { ipv4_address: 10.213.2.254 }
    healthcheck:
      test: ["CMD-SHELL", "iptables -t nat -S POSTROUTING | grep -q MASQUERADE"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Servidor de base de dades (intranet). La càrrega del CSV és una tasca a part.
  db:
    <<: *base
    build: { context: ./images/base, args: { PKGS: "mysql-server mysql-client" } }
    image: p00-db
    container_name: B-${NCC:-N06}
    hostname: B-${NCC:-N06}
    command: ["mysqld", "--user=mysql", "--bind-address=0.0.0.0", "--skip-name-resolve"]
    environment:
      GATEWAY: 10.213.2.254
      DB_NAME: equipaments
      DB_USER: bchecker
      DB_PASS: bchecker121
    volumes:
      - db-data:/var/lib/mysql
      - ./services/db/init.sh:/opt/init.sh:ro
      - ./services/db/init.sql:/opt/init.sql:ro
    networks:
      intranet: { ipv4_address: 10.213.2.10 }
    depends_on: { router: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -ubchecker -pbchecker121 --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
