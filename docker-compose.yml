# P0.0 - Desplegament d'infraestructura amb Docker
# Cada servei és un contenidor. Els clients (Linux i Windows) no hi són: són màquines
# virtuals a Isard que arriben a la intranet per la xarxa itb 6, a través d'aquest equip
# (scripts/xarxa-clients.sh).
# Variables a .env (copia .env.example). NCC = identificador de l'equip (N06).
name: p00-${NCC:-N06}

x-base: &base
  restart: unless-stopped
  cap_add: [NET_ADMIN]

# Xarxes de la pràctica (adreçament fix)
networks:
  dmz:                              # serveis exposats a Internet
    ipam:
      config: [{ subnet: 10.213.1.0/24, gateway: 10.213.1.1 }]
  intranet:                         # serveis interns; els clients (VM d'Isard) hi arriben per itb 6
    driver_opts:
      com.docker.network.bridge.name: br-intranet   # nom fix, l'usa scripts/xarxa-clients.sh
      # Els clients d'Isard arriben als contenidors per enrutament directe: des de Docker 28
      # això està bloquejat per defecte (regles raw PREROUTING). Només afecta a la intranet.
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config: [{ subnet: 10.213.2.0/24, gateway: 10.213.2.1 }]
  nat:                              # sortida a Internet
    ipam:
      config: [{ subnet: 10.213.3.0/24, gateway: 10.213.3.1 }]

volumes:
  db-data:                          # dades de MySQL (persistents)
  monitor-data:                     # dades d'Uptime Kuma (sondes i historial)

services:
  # Router: únic contenidor connectat a les tres xarxes. Fa el reenviament,
  # el NAT cap a Internet i el firewall (services/router/init.sh).
  router:
    <<: *base
    build: { context: ./images/base }
    image: p00-base
    container_name: R-${NCC:-N06}
    hostname: R-${NCC:-N06}
    command: ["sleep", "infinity"]
    sysctls: { net.ipv4.ip_forward: "1" }
    environment:
      GATEWAY: 10.213.3.1            # sortida a Internet (xarxa NAT)
    ports:
      - "2222:2222"                  # SSH: el router el reenvia a S-N06 (DNAT a init.sh)
      - "80:80"                      # web (HTTP, redirigeix a HTTPS): cap a W-N06
      - "443:443"                    # web (HTTPS): cap a W-N06
      - "21:21"                      # FTP (control): cap a F-N06
      - "30000-30009:30000-30009"    # FTP (mode passiu): cap a F-N06
    volumes:
      - ./services/router/init.sh:/opt/init.sh:ro
    networks:
      nat:      { ipv4_address: 10.213.3.2, gw_priority: 1 }   # els ports publicats entren per aquí
      dmz:      { ipv4_address: 10.213.1.254 }
      intranet: { ipv4_address: 10.213.2.254 }
    healthcheck:
      test: ["CMD-SHELL", "iptables -t nat -S POSTROUTING | grep -q MASQUERADE"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Servidor SSH (DMZ): port 2222, només clau pública (docs/07).
  ssh:
    <<: *base
    build: { context: ./images/base }
    image: p00-base
    container_name: S-${NCC:-N06}
    hostname: S-${NCC:-N06}
    command: ["sleep", "infinity"]
    environment:
      GATEWAY: 10.213.1.254
      DNS_SERVER: 10.213.2.53
    volumes:
      - ./services/ssh/init.sh:/opt/init.sh:ro
      - ./services/ssh/authorized_keys:/opt/authorized_keys:ro
    networks:
      dmz: { ipv4_address: 10.213.1.12 }
    depends_on: { router: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web (DMZ): nginx (80/443) davant de l'aplicació Flask, que escolta a gunicorn pel port 5000.
  web:
    <<: *base
    build: { context: ./images/base, args: { PKGS: "nginx openssl gunicorn python3-flask python3-pymysql" } }
    image: p00-web
    container_name: W-${NCC:-N06}
    hostname: W-${NCC:-N06}
    command: ["gunicorn", "--chdir", "/opt/app", "-b", "0.0.0.0:5000", "-w", "2", "app:app"]
    environment:
      GATEWAY: 10.213.1.254
      DNS_SERVER: 10.213.2.53
      DB_HOST: 10.213.2.10
      DB_NAME: equipaments
      DB_USER: bchecker
      DB_PASS: bchecker121
      APP_USER: bchecker             # credencials de l'aplicació (HTTP Basic)
      APP_PASS: bchecker121
    volumes:
      - ./services/web/app:/opt/app:ro
      - ./services/web/init.sh:/opt/init.sh:ro
      - ./services/web/nginx.conf:/opt/nginx.conf:ro
    networks:
      dmz: { ipv4_address: 10.213.1.10 }
    depends_on:
      router: { condition: service_healthy }
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:5000/health >/dev/null && curl -fsk https://127.0.0.1/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Servidor FTP (DMZ): vsftpd, només bchecker, mode passiu 30000-30009 (docs/24).
  ftp:
    <<: *base
    build: { context: ./images/base, args: { PKGS: "vsftpd" } }
    image: p00-ftp
    container_name: F-${NCC:-N06}
    hostname: F-${NCC:-N06}
    command: ["vsftpd", "/etc/vsftpd.conf"]
    environment:
      GATEWAY: 10.213.1.254
      DNS_SERVER: 10.213.2.53
      # Adreça per on entren els clients (l'equip dels serveis a itb 6); es pot canviar a .env
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS:-192.168.50.22}
    volumes:
      - ./services/ftp/init.sh:/opt/init.sh:ro
    networks:
      dmz: { ipv4_address: 10.213.1.11 }
    depends_on: { router: { condition: service_healthy } }
    healthcheck:
      # Interval llarg a propòsit: el vsftpd es tanca (codi 139) amb connexions seguides, i així
      # n'hi ha menys (docs/24, apartat 4). A l'arrencada es comprova cada 2 s.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/21'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 2s

  # Monitor de xarxa (intranet): Uptime Kuma, al port 3001 (docs/26).
  monitor:
    <<: *base
    build: { context: ./services/monitor }
    image: p00-monitor
    container_name: MON-${NCC:-N06}
    hostname: MON-${NCC:-N06}
    environment:
      GATEWAY: 10.213.2.254
      DNS_SERVER: 10.213.2.53
    volumes:
      - monitor-data:/app/data
    networks:
      intranet: { ipv4_address: 10.213.2.20 }
    depends_on: { router: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Servidor DHCP (intranet): dnsmasq. Reparteix 10.213.2.100-200 (docs/25).
  dhcp:
    <<: *base
    build: { context: ./images/base, args: { PKGS: "dnsmasq" } }
    image: p00-dhcp
    container_name: DHCP-${NCC:-N06}
    hostname: DHCP-${NCC:-N06}
    command: ["dnsmasq", "-k", "--log-facility=-", "--conf-file=/etc/dnsmasq.d/p00-dhcp.conf"]
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      GATEWAY: 10.213.2.254
      DNS_SERVER: 10.213.2.53
    volumes:
      - ./services/dhcp/init.sh:/opt/init.sh:ro
    networks:
      intranet: { ipv4_address: 10.213.2.67 }
    depends_on: { router: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x dnsmasq >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor DNS (intranet): dnsmasq. Resol asix.local i reenvia la resta (docs/08).
  dns:
    <<: *base
    build: { context: ./images/base, args: { PKGS: "dnsmasq" } }
    image: p00-dns
    container_name: DNS-${NCC:-N06}
    hostname: DNS-${NCC:-N06}
    command: ["dnsmasq", "-k", "--log-facility=-", "--conf-file=/etc/dnsmasq.d/p00.conf"]
    environment:
      GATEWAY: 10.213.2.254
    volumes:
      - ./services/dns/init.sh:/opt/init.sh:ro
    networks:
      intranet: { ipv4_address: 10.213.2.53 }
    depends_on: { router: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 @127.0.0.1 b-n06.asix.local | grep -q 10.213.2.10"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor de base de dades (intranet). El CSV es carrega amb /opt/load_csv.py (docs/03).
  db:
    <<: *base
    build: { context: ./images/base, args: { PKGS: "mysql-server mysql-client python3 python3-pymysql" } }
    image: p00-db
    container_name: B-${NCC:-N06}
    hostname: B-${NCC:-N06}
    command: ["mysqld", "--user=mysql", "--bind-address=0.0.0.0", "--skip-name-resolve"]
    environment:
      GATEWAY: 10.213.2.254
      DNS_SERVER: 10.213.2.53
      DB_NAME: equipaments
      DB_USER: bchecker
      DB_PASS: bchecker121
    volumes:
      - db-data:/var/lib/mysql
      - ./services/db/init.sh:/opt/init.sh:ro
      - ./services/db/init.sql:/opt/init.sql:ro
      - ./services/db/load_csv.py:/opt/load_csv.py:ro
      - ./data:/data:ro               # còpia local del CSV, si no hi ha descarrega
    networks:
      intranet: { ipv4_address: 10.213.2.10 }
    depends_on: { router: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -ubchecker -pbchecker121 --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
