<text x="486" y="756" font-size="12.5" fill="#222">Internet → W: 80, 443 (DNAT)</text>
<circle cx="472" cy="774" r="5" fill="#2e7d32"/>
<text x="486" y="778" font-size="12.5" fill="#222">Internet → F: 21 + passiu 30000-30009</text>
<circle cx="472" cy="796" r="5" fill="#2e7d32"/>
<text x="486" y="800" font-size="12.5" fill="#222">Internet → S: 2222 (→ 22)</text>
<circle cx="472" cy="818" r="5" fill="#2e7d32"/>
<text x="486" y="822" font-size="12.5" fill="#222">Intranet → DMZ i Internet: tot</text>
<circle cx="472" cy="840" r="5" fill="#2e7d32"/>
<text x="486" y="844" font-size="12.5" fill="#222">DMZ → B: TCP 3306 · DMZ → DNS: UDP/TCP 53</text>
<circle cx="472" cy="862" r="5" fill="#2e7d32"/>
<text x="486" y="866" font-size="12.5" fill="#222">DMZ → Internet: tot (actualitzacions)</text>
<circle cx="472" cy="884" r="5" fill="#c62828"/>
<text x="486" y="888" font-size="12.5" fill="#222">DMZ → resta d'Intranet: bloquejat</text>
