<text x="440" y="668" font-size="12" fill="#c62828">DMZ → resta d'Intranet:</text>
<text x="590" y="668" font-size="12" font-weight="bold" fill="#c62828">BLOQUEJAT</text>
<rect x="450" y="700" width="400" height="220" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
<text x="470" y="728" font-size="13.5" font-weight="bold" fill="#222">Política del firewall (FORWARD DROP)</text>
